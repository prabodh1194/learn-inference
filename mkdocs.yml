      - 08 Continuous batching: 08-continuous-batching.md
      - 09 Paged attention: 09-paged-attention.md
      - 10 Prefix caching: 10-prefix-caching.md
      - 11 Chunked prefill: 11-chunked-prefill.md
      - 12 Speculative decoding: 12-speculative-decoding.md
      - 12b Structured output: 12b-structured-output.md

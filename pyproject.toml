[project]
name = "learn-inference"
version = "0.1.0"
description = "Building an LLM inference engine from scratch, Zero-to-Hero style"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.45",
    "tokenizers",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "matplotlib",
    "rich",
]

[project.optional-dependencies]
# Phase 2 — kernels. Triton is Linux/NVIDIA only; install on the rented box.
kernels = ["triton"]
# Phase 3 — JAX. Use jax[cuda12] on the rented box instead.
jax = ["jax", "jaxlib", "flax"]
# Phase 4 — serving.
serve = ["fastapi", "uvicorn[standard]", "httpx", "sse-starlette"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "bench", "jaxlm", "serve", "kernels"]
